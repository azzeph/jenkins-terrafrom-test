[defaults]
# Inventory is generated per branch by scripts/terraform_inventory.py:
#   ansible/inventory/<branch>/hosts.ini
inventory = ./inventory/local/hosts.ini
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

# ansible-core >= 2.13: the old 'yaml' stdout callback was removed.
# Use the default callback with YAML-friendly result formatting instead.
stdout_callback = default
result_format = yaml

callbacks_enabled = profile_tasks
deprecation_warnings = False
forks = 10
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
